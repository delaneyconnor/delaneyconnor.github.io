<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Delaney Connor — Designer, Researcher, Urban Strategist">
  <title>Delaney Connor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=97">
</head>
<body>

  <!-- Intro / home screen -->
  <div id="intro" class="intro">
    <div id="intro-name" class="intro-name">DELANEY CONNOR</div>
    <div id="intro-line" class="intro-line"></div>
    <button id="view-btn" class="view-btn" onclick="startPortfolio()">View Portfolio</button>
  </div>

  <!-- Main app (hidden until intro completes) -->
  <div id="app" class="app">

    <div id="bg-tiles" aria-hidden="true"></div>

    <header class="top-bar">
      <button class="site-name" id="about-btn">
        <span class="site-name-full">DELANEY CONNOR</span>
        <span class="site-name-short">DC</span>
      </button>
      <div class="header-right">
        <div id="filter-bar" class="filter-bar"></div>
        <button id="filter-mobile-toggle" class="filter-mobile-toggle">
          <span id="filter-mobile-label">All</span>
          <span class="filter-mobile-caret">▼</span>
        </button>
      </div>
    </header>

    <div id="filter-dropdown" class="filter-dropdown"></div>

    <div class="timeline-shell">
      <div id="canvas-wrap" class="canvas-wrap">
        <div id="canvas" class="canvas"></div>
      </div>
    </div>

    <div id="scrim" class="scrim"></div>

    <!-- Detail panel -->
    <div id="detail-sheet" class="detail-sheet">
      <div class="sheet-nav">
        <button id="sheet-close" class="sheet-close"><span>←</span><span>back</span></button>
        <button id="sheet-next" class="sheet-next"><span>→</span><span>next</span></button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>

  </div>

  <script src="script.js?v=64"></script>
</body>
</html>

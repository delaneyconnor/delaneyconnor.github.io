<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Delaney Connor — Designer, Researcher, Urban Strategist">
  <title>Delaney Connor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-bar">
    <button class="site-name" id="about-btn">DELANEY CONNOR</button>
    <div class="header-right">
      <div id="filter-bar" class="filter-bar"></div>
      <div class="zoom-wrap">
        <span class="zoom-icon" title="Zoom out">−</span>
        <input type="range" id="zoom-slider" min="3" max="60" step="0.5" value="10">
        <span class="zoom-icon" title="Zoom in">+</span>
      </div>
    </div>
  </header>

  <div class="timeline-shell">
    <div class="corner">
      <span class="corner-hint">ctrl+scroll to zoom</span>
    </div>
    <div class="ruler-wrap">
      <div id="year-ruler" class="year-ruler"></div>
    </div>
    <div class="labels-wrap">
      <div id="row-labels" class="row-labels"></div>
    </div>
    <div id="canvas-wrap" class="canvas-wrap">
      <div id="canvas" class="canvas"></div>
    </div>
  </div>

  <aside id="detail-panel" class="detail-panel">
    <button id="detail-close" class="detail-close">×</button>
    <div id="detail-body" class="detail-body"></div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
